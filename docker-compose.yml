services:
  printscript:
    build: .
    image: ghcr.io/janpaulb/printscript:latest
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      # Optional: an OAuth access token for private Google documents.
      # GOOGLE_ACCESS_TOKEN: "ya29.…"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
