name: Tests

on:
  push:
    branches: ['**']
    # Zonder deze regel draait er bij een versietag niets, en verschijnt het
    # uitrolpakket dus nooit bij de releases.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: Testsuite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, dom, mbstring, gd, curl
          coverage: none

      - name: Composer-cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}

      - name: Packages installeren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests draaien
        run: composer test

  release:
    name: Uitrolpakket bouwen
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: phpunit
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, dom, mbstring, gd, curl
          coverage: none

      - name: Pakket bouwen
        run: ./build-release.sh

      - name: Bij de release zetten
        uses: softprops/action-gh-release@v2
        with:
          files: printscript-php.zip
          body: |
            Download `printscript-php.zip`, pak hem uit en zet de inhoud in de
            webmap van je server. Verder is er niets te configureren.
